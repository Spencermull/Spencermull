<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <filter id="glow-title" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"  result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"  result="b3"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-line" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="900" height="1" fill="#00f0ff" opacity="0.04"/>
    </pattern>

    <style>
      @keyframes flicker {
        0%,18%,20%,22%,25%,53%,57%,100% { opacity: 1; }
        19%,23%,24%       { opacity: 0.45; }
        21%,56%           { opacity: 0.65; }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.6; }
        50%     { opacity: 0.3; }
      }
      @keyframes bracketFade {
        0%,100% { opacity: 0.9; }
        50%     { opacity: 0.45; }
      }
      @keyframes sweep {
        0%   { transform: translateY(-10px); opacity: 0;   }
        5%   { opacity: 0.25; }
        95%  { opacity: 0.25; }
        100% { transform: translateY(210px); opacity: 0; }
      }
      .title    { animation: flicker    8s ease-in-out infinite; }
      .sub      { animation: pulse      4s ease-in-out infinite; }
      .bracket  { animation: bracketFade 5s ease-in-out infinite; }
      .sweep    { animation: sweep      9s linear     infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#000000"/>

  <!-- Scanline texture -->
  <rect width="900" height="200" fill="url(#scanlines)"/>

  <!-- ── Corner brackets ── -->
  <!-- top-left -->
  <path class="bracket" d="M 28,64 L 28,28 L 64,28"
    stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow-line)"/>
  <!-- top-right -->
  <path class="bracket" d="M 872,64 L 872,28 L 836,28"
    stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow-line)"/>
  <!-- bottom-left -->
  <path class="bracket" d="M 28,136 L 28,172 L 64,172"
    stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow-line)"/>
  <!-- bottom-right -->
  <path class="bracket" d="M 872,136 L 872,172 L 836,172"
    stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow-line)"/>

  <!-- ── Horizontal divider lines ── -->
  <line x1="80" y1="44" x2="820" y2="44"
    stroke="#00f0ff" stroke-width="0.75" opacity="0.35" filter="url(#glow-line)"/>
  <line x1="80" y1="156" x2="820" y2="156"
    stroke="#00f0ff" stroke-width="0.75" opacity="0.35" filter="url(#glow-line)"/>

  <!-- Accent dots at line terminals -->
  <circle cx="80"  cy="44"  r="2.5" fill="#00f0ff" opacity="0.7" filter="url(#glow-line)"/>
  <circle cx="820" cy="44"  r="2.5" fill="#00f0ff" opacity="0.7" filter="url(#glow-line)"/>
  <circle cx="80"  cy="156" r="2.5" fill="#00f0ff" opacity="0.7" filter="url(#glow-line)"/>
  <circle cx="820" cy="156" r="2.5" fill="#00f0ff" opacity="0.7" filter="url(#glow-line)"/>

  <!-- ── Main title ── -->
  <text class="title"
    x="450" y="108"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="46" font-weight="bold" letter-spacing="12"
    fill="#00f0ff"
    filter="url(#glow-title)">SPENCER MULLER</text>

  <!-- ── Subtitle ── -->
  <text class="sub"
    x="450" y="135"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="11" letter-spacing="5"
    fill="#00f0ff">ML / AI  ·  AUTONOMOUS SYSTEMS  ·  FULL STACK</text>

  <!-- ── Scanline sweep ── -->
  <rect class="sweep" x="0" y="-10" width="900" height="10" fill="#00f0ff" opacity="0"/>

</svg>
