<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"  result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b3"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-sub" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="900" height="1" fill="#00f0ff" opacity="0.03"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;display=swap');
      @keyframes flicker {
        0%,18%,20%,22%,25%,53%,57%,100% { opacity: 1; }
        19%,23%,24% { opacity: 0.4; }
        21%,56%     { opacity: 0.7; }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.55; }
        50%     { opacity: 0.25; }
      }
      @keyframes sweep {
        0%   { transform: translateY(-12px); opacity: 0; }
        5%   { opacity: 0.2; }
        95%  { opacity: 0.2; }
        100% { transform: translateY(232px); opacity: 0; }
      }
      .title { animation: flicker 8s ease-in-out infinite; }
      .sub   { animation: pulse  5s ease-in-out infinite; }
      .sweep { animation: sweep  9s linear infinite; }
    </style>
  </defs>

  <rect width="900" height="220" fill="#000000"/>
  <rect width="900" height="220" fill="url(#scanlines)"/>

  <text class="title"
    x="450" y="128"
    text-anchor="middle"
    font-family="'Orbitron', 'Courier New', monospace"
    font-size="68" font-weight="700" letter-spacing="10"
    fill="#00f0ff"
    filter="url(#glow)">SPENCER MULLER</text>

  <text class="sub"
    x="450" y="168"
    text-anchor="middle"
    font-family="'Orbitron', 'Courier New', monospace"
    font-size="12" letter-spacing="6"
    fill="#00f0ff"
    filter="url(#glow-sub)">ML / AI  ·  AUTONOMOUS SYSTEMS  ·  FULL STACK</text>

  <rect class="sweep" x="0" y="-12" width="900" height="12" fill="#00f0ff" opacity="0"/>

</svg>
